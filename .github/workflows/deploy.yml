name: Test and deploy

# Vercel's build image has no JDK or Gradle, so it cannot build a Kotlin/Wasm
# app itself. GitHub's runner does the build and hands Vercel the finished
# static bundle.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties pins the daemon to Azul 21;
      # matching it here avoids Gradle downloading its own JDK on every run.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        env:
          # Karma runs the suite in a real browser; ubuntu-latest ships Chrome.
          CHROME_BIN: /usr/bin/google-chrome
        run: ./gradlew :shared:jsTest

      - name: Build production bundle
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          STAGE=build/vercel/dalat-trip
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -r webApp/build/dist/wasmJs/productionExecutable/. "$STAGE"/
          cd "$STAGE"
          npx -y vercel deploy --prod --yes --token "$VERCEL_TOKEN"
